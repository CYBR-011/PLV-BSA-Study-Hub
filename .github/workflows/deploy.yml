name: Deploy PLV BSA Study Hub to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site files
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp -f *.html *.js *.css *.json *.png *.jpg *.svg _site/ 2>/dev/null || true
          if [ ! -f "_site/index.html" ]; then
            if [ -f "_site/pinoy-bsa-hub-standalone.html" ]; then
              cp "_site/pinoy-bsa-hub-standalone.html" "_site/index.html"
            else
              FIRST_HTML=$(ls _site/*.html 2>/dev/null | head -n 1)
              if [ -n "$FIRST_HTML" ]; then
                cp "$FIRST_HTML" "_site/index.html"
              else
                echo "ERROR: No .html file found in repository root!"
                exit 1
              fi
            fi
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
