name: Deploy PLV BSA Study Hub to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site files
        run: |
          mkdir -p _site
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
          elif [ -f "pinoy-bsa-hub-standalone.html" ]; then
            cp pinoy-bsa-hub-standalone.html _site/index.html
          fi
          if [ -f "pinoy-bsa-hub-standalone.html" ]; then
            cp pinoy-bsa-hub-standalone.html _site/pinoy-bsa-hub-standalone.html
          fi
          cp -f *.js *.css _site/ 2>/dev/null || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
